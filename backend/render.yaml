services:
  - type: web
    name: deepsea-edna-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: MODEL_DIR
        value: ../ml_models
      - key: DEFAULT_MODEL
        value: marine_model
      - key: MODEL_DEVICE
        value: cpu
      - key: CORS_ORIGINS
        sync: false
